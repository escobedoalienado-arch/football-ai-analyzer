name: Atualizar jogos do Brasileirão

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar jogos no FotMob
        shell: python
        run: |
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          BASE = "https://www.fotmob.com"
          # IDs usados pelo FotMob:
          # 268 = Brasileirão Série A
          # 8814 = Brasileirão Série B
          # IDs internos do nosso aplicativo continuam 325/390.
          LEAGUES = {
              268: {"name": "Brasileirão Série A", "app_id": 325},
              8814: {"name": "Brasileirão Série B", "app_id": 390},
          }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://www.fotmob.com/",
              "Origin": "https://www.fotmob.com",
          })

          def get_json(url):
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=30)
                      if r.ok:
                          return r.json()
                      last = RuntimeError(f"HTTP {r.status_code} em {url}")
                  except Exception as e:
                      last = e
                  time.sleep(2 + attempt * 2)
              raise last

          def iso_time(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  ).astimezone(timezone.utc).isoformat()
              except Exception:
                  return None

          def normalize_match(m, source_league_id, league):
              home = m.get("home") or {}
              away = m.get("away") or {}
              status = m.get("status") or {}

              date = (
                  iso_time(status.get("utcTime"))
                  or iso_time(m.get("utcTime"))
              )
              if not date:
                  return None

              return {
                  "id": m.get("id"),
                  "fotmobId": m.get("id"),
                  "sourceLeagueId": source_league_id,
                  "leagueId": league["app_id"],
                  "leagueName": league["name"],
                  "date": date,
                  "status": (
                      "finished" if status.get("finished")
                      else "inprogress" if status.get("started")
                      else "notstarted"
                  ),
                  "statusCode": None,
                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "shortName": home.get("shortName") or home.get("name"),
                      "slug": home.get("slug"),
                      "logo": (
                          f"https://images.fotmob.com/image_resources/logo/teamlogo/{home.get('id')}.png"
                      ) if home.get("id") else "",
                  },
                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "shortName": away.get("shortName") or away.get("name"),
                      "slug": away.get("slug"),
                      "logo": (
                          f"https://images.fotmob.com/image_resources/logo/teamlogo/{away.get('id')}.png"
                      ) if away.get("id") else "",
                  },
                  "goals": {
                      "home": home.get("score"),
                      "away": away.get("score"),
                  },
                  "round": (
                      m.get("round")
                      or m.get("roundName")
                      or (m.get("tournamentStage") or {}).get("round")
                  ),
                  "venue": "",
              }

          def extract_matches(data):
              """
              FotMob já mudou a estrutura dessas respostas algumas vezes.
              Aceitamos as estruturas conhecidas sem depender de uma única chave.
              """
              candidates = [
                  ((data.get("fixtures") or {}).get("allMatches") or []),
                  ((data.get("matches") or {}).get("allMatches") or []),
                  ((data.get("fixtures") or {}).get("matches") or []),
                  ((data.get("matches") or {}).get("matches") or []),
                  data.get("allMatches") or [],
              ]

              for arr in candidates:
                  if isinstance(arr, list) and arr:
                      return arr

              found = []

              def walk(obj):
                  if isinstance(obj, dict):
                      for key, value in obj.items():
                          if key == "allMatches" and isinstance(value, list):
                              found.extend(value)
                          else:
                              walk(value)
                  elif isinstance(obj, list):
                      for item in obj:
                          walk(item)

              walk(data)

              # Remove duplicados mantendo a ordem.
              out = []
              seen = set()
              for m in found:
                  if not isinstance(m, dict):
                      continue
                  mid = m.get("id")
                  if mid is None or mid not in seen:
                      if mid is not None:
                          seen.add(mid)
                      out.append(m)
              return out

          fixtures = []
          seasons = {}

          for source_id, league in LEAGUES.items():
              print(f"Consultando {league['name']} (FotMob {source_id})...")

              # Endpoint atual documentado do FotMob.
              url = f"{BASE}/api/data/leagues?id={source_id}&season=2026"
              data = get_json(url)

              details = data.get("details") or {}
              selected = details.get("selectedSeason") or "2026"

              seasons[str(league["app_id"])] = {
                  "id": selected,
                  "year": "2026",
                  "name": selected,
                  "source": "FotMob",
                  "sourceLeagueId": source_id,
              }

              matches = extract_matches(data)
              print(f"  Encontrados {len(matches)} jogos na resposta.")

              for m in matches:
                  f = normalize_match(m, source_id, league)
                  if not f:
                      continue
                  if not f["home"]["name"] or not f["away"]["name"]:
                      continue
                  if not str(f["date"]).startswith("2026-"):
                      continue
                  fixtures.append(f)

          unique = {}
          for f in fixtures:
              if f["id"] is not None:
                  unique[str(f["id"])] = f

          fixtures = sorted(unique.values(), key=lambda x: x["date"])

          teams = {}
          for f in fixtures:
              for t in (f["home"], f["away"]):
                  if t.get("id") is not None:
                      teams[str(t["id"])] = {
                          **t,
                          "leagueId": f["leagueId"],
                      }

          payload = {
              "updatedAt": int(time.time() * 1000),
              "updatedAtISO": datetime.now(timezone.utc).isoformat(),
              "source": "FotMob",
              "seasons": seasons,
              "teams": list(teams.values()),
              "fixtures": fixtures,
          }

          Path("data.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Gravados {len(fixtures)} jogos e {len(teams)} clubes.")

          if not fixtures:
              raise SystemExit(
                  "O FotMob respondeu, mas nenhum jogo de 2026 foi encontrado."
              )

      - name: Publicar banco atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Sem alterações no banco."
            exit 0
          fi

          git commit -m "Atualiza jogos do Brasileirão via FotMob"
          git push
