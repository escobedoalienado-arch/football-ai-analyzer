name: Atualizar jogos do Brasileirão

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar jogos no FotMob
        shell: python
        run: |
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          BASE = "https://www.fotmob.com/api"
          LEAGUES = {
              268: "Brasileirão Série A",
              8814: "Brasileirão Série B",
          }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://www.fotmob.com/",
              "Origin": "https://www.fotmob.com",
          })

          def get_json(url):
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=30)
                      if r.ok:
                          return r.json()
                      last = RuntimeError(f"HTTP {r.status_code} em {url}")
                  except Exception as e:
                      last = e
                  time.sleep(2 + attempt * 2)
              raise last

          def iso_from_utc_time(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  ).astimezone(timezone.utc).isoformat()
              except Exception:
                  return None

          def normalize_match(m, league_id, league_name):
              home = m.get("home") or {}
              away = m.get("away") or {}
              status = m.get("status") or {}

              date = (
                  iso_from_utc_time(status.get("utcTime"))
                  or iso_from_utc_time(m.get("utcTime"))
              )
              if not date:
                  return None

              home_score = home.get("score")
              away_score = away.get("score")

              return {
                  "id": m.get("id"),
                  "leagueId": league_id,
                  "leagueName": league_name,
                  "date": date,
                  "status": (
                      "finished" if status.get("finished")
                      else "inprogress" if status.get("started")
                      else "notstarted"
                  ),
                  "statusCode": None,
                  "home": {
                      "id": home.get("id"),
                      "name": home.get("name"),
                      "shortName": home.get("shortName") or home.get("name"),
                      "slug": home.get("slug"),
                      "logo": (
                          f"https://images.fotmob.com/image_resources/logo/teamlogo/"
                          f"{home.get('id')}.png"
                      ) if home.get("id") else "",
                  },
                  "away": {
                      "id": away.get("id"),
                      "name": away.get("name"),
                      "shortName": away.get("shortName") or away.get("name"),
                      "slug": away.get("slug"),
                      "logo": (
                          f"https://images.fotmob.com/image_resources/logo/teamlogo/"
                          f"{away.get('id')}.png"
                      ) if away.get("id") else "",
                  },
                  "goals": {
                      "home": home_score,
                      "away": away_score,
                  },
                  "round": (
                      m.get("round")
                      or m.get("roundName")
                      or (m.get("tournamentStage") or {}).get("round")
                  ),
                  "venue": "",
                  "fotmobId": m.get("id"),
              }

          fixtures = []
          seasons = {}

          for league_id, league_name in LEAGUES.items():
              print(f"Consultando {league_name} ({league_id})...")
              data = get_json(f"{BASE}/leagues?id={league_id}")

              details = data.get("details") or {}
              seasons_list = data.get("seasons") or []
              selected = details.get("selectedSeason")

              seasons[str(league_id)] = {
                  "id": selected or "2026",
                  "year": "2026",
                  "name": selected or "2026",
              }

              # O FotMob expõe os jogos da competição em fixtures.allMatches.
              all_matches = ((data.get("fixtures") or {}).get("allMatches") or [])

              # Mantém somente a temporada/calendário de 2026.
              for m in all_matches:
                  f = normalize_match(m, league_id, league_name)
                  if not f or not f["home"]["name"] or not f["away"]["name"]:
                      continue
                  if not str(f["date"]).startswith("2026-"):
                      continue
                  fixtures.append(f)

          # Remove duplicados e ordena.
          unique = {}
          for f in fixtures:
              if f["id"] is not None:
                  unique[str(f["id"])] = f

          fixtures = sorted(
              unique.values(),
              key=lambda x: x["date"]
          )

          teams = {}
          for f in fixtures:
              for t in (f["home"], f["away"]):
                  if t.get("id") is not None:
                      teams[str(t["id"])] = {
                          **t,
                          "leagueId": f["leagueId"]
                      }

          payload = {
              "updatedAt": int(time.time() * 1000),
              "updatedAtISO": datetime.now(timezone.utc).isoformat(),
              "source": "FotMob",
              "seasons": seasons,
              "teams": list(teams.values()),
              "fixtures": fixtures,
          }

          Path("data.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Gravados {len(fixtures)} jogos e {len(teams)} clubes.")

          if not fixtures:
              raise SystemExit(
                  "O FotMob respondeu, mas nenhum jogo de 2026 foi encontrado."
              )

      - name: Publicar banco atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Sem alterações no banco."
            exit 0
          fi

          git commit -m "Atualiza jogos do Brasileirão via FotMob"
          git push
